[project]
name = "vidarax-audio-runtime"
version = "0.1.0"
description = "Locked Python runtime for the Vidarax local audio sidecar"
requires-python = ">=3.12,<3.14"
dependencies = [
  "librosa>=0.10,<1",
  "msgpack>=1.1,<2",
  "numpy>=1.26,<3",
  "onnxruntime>=1.18,<2",
  "silero-vad>=6,<7",
  "timm>=1,<2",
  "torch>=2.5",
  "torchaudio>=2.5",
]

[project.optional-dependencies]
whisper = [
  "accelerate>=1.10",
  "transformers>=5.13,<6",
]
moonshine = [
  "accelerate>=1.10",
  "transformers>=5.13,<6",
]
qwen = [
  "accelerate>=1.10",
  "transformers>=5.13,<6",
]
sensevoice = [
  "funasr>=1.2,<2",
  "modelscope>=1.27,<2",
]
lfm = [
  "liquid-audio",
]

[tool.uv]
package = false
required-version = ">=0.10.0,<0.11"
